name: Check PHP code style

on:
  push:
    paths:
      - '**.php'

permissions:
  contents: read

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Check only: the org requires signed commits, so CI can't push style fixes. Run `vendor/bin/pint` locally.
      - name: Check PHP code style
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true
          verboseMode: true
